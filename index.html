<!DOCTYPE html>
<html lang="th">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* พื้นที่แสดงรูปภาพ */
        .image-box {
            width: 100%;
            height: 260px;
            border: 2px dashed rgba(56, 189, 248, 0.4);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.6);
            position: relative;
            transition: border-color 0.3s ease;
        }

        .image-box:hover {
            border-color: #38bdf8;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 12px;
        }

        .placeholder-text {
            color: #64748b;
            font-size: 0.95rem;
            pointer-events: none;
        }

        /* ปุ่มอัปโหลด */
        input[type="file"] {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 25px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.7);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        .upload-btn.disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            pointer-events: none;
        }

        #label-container {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
